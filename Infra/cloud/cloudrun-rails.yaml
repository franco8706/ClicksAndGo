# =========================================================
# ☁️ CLOUD RUN — Rails Backend (El Guardián Transaccional)
# Deploy: gcloud run services replace Infra/cloud/cloudrun-rails.yaml --region us-central1
# =========================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clicks-rails
  labels:
    app: clicks-and-go
    tier: backend
  annotations:
    # Pre-lanzamiento: público a nivel red (lo consume el frontend Next.js).
    # Endurecer con IAM (roles/run.invoker) + tokens de identidad antes del launch.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 💰 Escala a 0 en pre-lanzamiento (se acepta ~2-4s de cold-start en la
        # 1ª visita). Subir a "1" cuando el tráfico lo justifique.
        # 💰 minScale=0 — escala a cero (1ª visita paga ~1-4s de cold-start).
        # Historia: el 2026-07-17, durante la ventana de recuperación tras la
        # suspensión por billing, el scale-from-zero devolvía 429 ("no available
        # instance") aunque el contenedor arrancaba sano. Se mitigó temporalmente
        # con minScale=1. Verificado el mismo día que el cold-start se recuperó
        # (log "Starting new instance. Reason: AUTOSCALING" + HTTP 200) → vuelto
        # a 0. Si reaparece el 429 tras un corte de billing, subir a 1 y esperar.
        autoscaling.knative.dev/minScale: "0"
        # 🔌 maxScale NO es una perilla de tráfico: es el reparto de las
        # conexiones de Postgres. Ver el bloque "PRESUPUESTO DE CONEXIONES"
        # más abajo antes de subirlo.
        autoscaling.knative.dev/maxScale: "4"
        # 💰 CPU facturada solo durante requests (Rails no hace trabajo de fondo).
        run.googleapis.com/cpu-throttling: "true"
        # Conexión a Cloud SQL vía socket unix (Auth Proxy embebido, sin IP pública)
        run.googleapis.com/cloudsql-instances: clicks-and-go:us-central1:clicks-db2
    spec:
      # Service account con permisos de Cloud SQL Client + Secret Manager
      serviceAccountName: clicks-sa@clicks-and-go.iam.gserviceaccount.com
      # Requests en vuelo por instancia. Estaba en 80 contra 10 hilos reales:
      # las 70 restantes hacían cola contra el timeout de 30s en vez de
      # disparar el escalado, así que la instancia se ahogaba sin que Cloud Run
      # se enterara. 8 deja una cola corta (respuestas cacheadas, ~50 ms) antes
      # de pagar un cold-start.
      containerConcurrency: 8
      timeoutSeconds: 30
      containers:
      - image: us-central1-docker.pkg.dev/clicks-and-go/clicks-and-go/rails:latest
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
        env:
        - name: RAILS_ENV
          value: production
        # ═══ PRESUPUESTO DE CONEXIONES A POSTGRES ═══════════════════════
        # `clicks-db2` es db-f1-micro: max_connections = 25, de las cuales 3
        # quedan reservadas al superusuario y ~2 las usa el agente de Cloud SQL.
        # Quedan ~20 para la app, y Rails es el ÚNICO servicio que habla con
        # Postgres (Python y Next.js entran por su API).
        #
        #     conexiones máximas = maxScale × WEB_CONCURRENCY × RAILS_MAX_THREADS
        #                        =    4     ×       1         ×        4        = 16
        #
        # Antes: 20 × 2 × 5 = 200 contra un techo de 20. Con tráfico bajo nunca
        # se notaba; bastaban 3 instancias simultáneas para que Postgres
        # empezara a rechazar conexiones y el sitio devolviera 500 entero.
        #
        # Un worker en vez de dos: el contenedor tiene 1 vCPU y 512Mi. Dos
        # procesos Puma con `preload_app!` se pisan en CPU y rozan el techo de
        # memoria; en Cloud Run la unidad de escalado es la INSTANCIA, no el
        # worker. Si hace falta más concurrencia, lo que se sube es el tier de
        # Cloud SQL — estos tres números son el reparto de un presupuesto fijo.
        - name: WEB_CONCURRENCY
          value: "1"
        - name: RAILS_MAX_THREADS
          value: "4"
        # 🗄️ Cache en memoria (Redis eliminado por costo — ver cache_store.rb).
        # Al no definir REDIS_URL, Rails usa :memory_store automáticamente.
        # Secretos inyectados desde Secret Manager (nunca hardcodeados)
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: DATABASE_URL
              key: latest
        - name: SECRET_KEY_BASE
          valueFrom:
            secretKeyRef:
              name: SECRET_KEY_BASE
              key: latest
        # 🛡️ Protege /api/v1/users/** (perfil/favoritos/alertas) de llamadas
        # externas directas mientras ingress sea "all" — solo Next.js la conoce.
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: INTERNAL_API_KEY
              key: latest
        startupProbe:
          httpGet:
            path: /up
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 12
        livenessProbe:
          httpGet:
            path: /up
          initialDelaySeconds: 30
          periodSeconds: 15
          failureThreshold: 3
