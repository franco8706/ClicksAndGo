# =========================================================
# ☁️ CLOUD RUN — Next.js Frontend (La Fachada)
# Deploy: gcloud run services replace Infra/cloud/cloudrun-web.yaml --region us-central1
#
# Para picos de tráfico, poner Cloud CDN delante (ya hay un LB: clicks-lb).
# =========================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clicks-web
  labels:
    app: clicks-and-go
    tier: frontend
  annotations:
    # Único servicio realmente público (frontend). Detrás del LB clicks-lb.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 💰 Pre-lanzamiento: escala a 0 para gasto casi nulo (1ª visita ~2-4s de
        # cold-start). Poner "1" para mantener el frontend siempre caliente en prod.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "50"
        # 💰 CPU facturada solo durante requests.
        run.googleapis.com/cpu-throttling: "true"
        # NextAuth (adaptador pg) conecta a Cloud SQL por socket unix.
        run.googleapis.com/cloudsql-instances: clicks-and-go:us-central1:clicks-db
    spec:
      serviceAccountName: clicks-sa@clicks-and-go.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 30
      containers:
      - image: us-central1-docker.pkg.dev/clicks-and-go/clicks-and-go/web:latest
        ports:
        - name: http1
          containerPort: 3000
        resources:
          limits:
            cpu: "1"
            memory: 1Gi
        env:
        - name: NODE_ENV
          value: production
        - name: RAILS_API_URL
          value: https://clicks-rails-798903122073.us-central1.run.app
        # URL pública para NextAuth (protección de host-header). Cambiar al dominio
        # final (https://clicksandgo.com) cuando se conecte por el LB.
        - name: AUTH_URL
          value: https://clicks-web-798903122073.us-central1.run.app
        - name: AUTH_TRUST_HOST
          value: "true"
        # Secretos desde Secret Manager
        - name: AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: AUTH_SECRET
              key: latest
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: DATABASE_URL
              key: latest
        # 🛡️ Clave compartida para llamar /api/v1/users/** en Rails (perfil,
        # favoritos, alertas) — nunca llega al navegador (server-only fetch).
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: INTERNAL_API_KEY
              key: latest
        # 📧 Login por magic link (NextAuth Resend provider) — se activa solo si
        # AUTH_RESEND_KEY está presente (ver Web/src/auth.ts). Mismo secreto que
        # usa PriceAlertAgent en Python para los avisos de "bajó de precio".
        # ⏸️ Descomentar cuando exista la cuenta Resend + el secreto en Secret Manager
        # (si se referencia un secreto inexistente, Cloud Run rechaza el deploy).
        - name: AUTH_FROM_EMAIL
          value: noreply@clicksandgo.com
        # - name: AUTH_RESEND_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: AUTH_RESEND_KEY
        #       key: latest
        # 🔑 OAuth (Google/Microsoft/Facebook) — CADA proveedor se activa solo si
        # SUS DOS variables están presentes (auth.ts). Descomentar de a pares
        # cuando se registren las apps en cada consola (ver RUNBOOK paso 6).
        # - name: AUTH_GOOGLE_ID
        #   valueFrom: { secretKeyRef: { name: AUTH_GOOGLE_ID, key: latest } }
        # - name: AUTH_GOOGLE_SECRET
        #   valueFrom: { secretKeyRef: { name: AUTH_GOOGLE_SECRET, key: latest } }
        # - name: AUTH_MICROSOFT_ID
        #   valueFrom: { secretKeyRef: { name: AUTH_MICROSOFT_ID, key: latest } }
        # - name: AUTH_MICROSOFT_SECRET
        #   valueFrom: { secretKeyRef: { name: AUTH_MICROSOFT_SECRET, key: latest } }
        # - name: AUTH_FACEBOOK_ID
        #   valueFrom: { secretKeyRef: { name: AUTH_FACEBOOK_ID, key: latest } }
        # - name: AUTH_FACEBOOK_SECRET
        #   valueFrom: { secretKeyRef: { name: AUTH_FACEBOOK_SECRET, key: latest } }
        startupProbe:
          httpGet:
            path: /
          initialDelaySeconds: 15
          periodSeconds: 5
          failureThreshold: 10
        livenessProbe:
          httpGet:
            path: /
          periodSeconds: 20
          failureThreshold: 3
