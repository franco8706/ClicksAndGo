# =========================================================
# ☁️ CLOUD RUN — Python AI Engine (El Cerebro)
# Deploy: gcloud run services replace Infra/cloud/cloudrun-python.yaml --region us-central1
# =========================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clicks-python
  labels:
    app: clicks-and-go
    tier: ai-engine
  annotations:
    # Lo despierta Cloud Scheduler (OIDC). Endurecer con IAM antes del launch.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 💰 Escala a 0 cuando no hay misiones — el NewsRadar ya NO corre en un
        # loop interno (NEWS_LOOP_ENABLED=false); lo dispara Cloud Scheduler
        # (scheduler-news.yaml). Así no pagamos una instancia 24/7.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: clicks-sa@clicks-and-go.iam.gserviceaccount.com
      # El orquestador corre tareas pesadas — 1 request a la vez por instancia es suficiente
      containerConcurrency: 1
      # Las misiones de scraping pueden tardar hasta 5 minutos
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/clicks-and-go/clicks-and-go/python:latest
        ports:
        - name: http1
          containerPort: 5001
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
        env:
        # 💰 Loop interno apagado en Cloud Run — Cloud Scheduler dispara /trigger/news.
        - name: NEWS_LOOP_ENABLED
          value: "false"
        - name: GCP_PROJECT_ID
          value: clicks-and-go
        - name: GCP_LOCATION
          value: us-central1
        # 💰 Tope diario de llamadas a IA de pago; al superarlo cae a Antigravity (costo cero)
        - name: AI_DAILY_LIMIT
          value: "500"
        # La service account del contenedor autentica Vertex AI automáticamente
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: ""
        - name: RAILS_API_URL
          value: https://clicks-rails-798903122073.us-central1.run.app/api/v1/notebooks
        - name: RUST_API_URL
          value: https://clicks-rust-798903122073.us-central1.run.app/api/v1/score/batch
        - name: RUST_BENCHMARK_URL
          value: https://clicks-rust-798903122073.us-central1.run.app/api/v1/benchmarks/run
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: MONGODB_URI
              key: latest
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
