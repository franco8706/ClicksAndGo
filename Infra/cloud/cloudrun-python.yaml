# =========================================================
# ☁️ CLOUD RUN — Python AI Engine (El Cerebro)
# Deploy: gcloud run services replace Infra/cloud/cloudrun-python.yaml --region us-central1
# =========================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clicks-python
  labels:
    app: clicks-and-go
    tier: ai-engine
  annotations:
    # Lo despierta Cloud Scheduler (OIDC). Endurecer con IAM antes del launch.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # 💰 Escala a 0 cuando no hay misiones — el NewsRadar ya NO corre en un
        # loop interno (NEWS_LOOP_ENABLED=false); lo dispara Cloud Scheduler
        # (scheduler-news.yaml). Así no pagamos una instancia 24/7.
        # 💰 minScale=0 — escala a cero (1ª visita paga ~1-4s de cold-start).
        # Historia: el 2026-07-17, durante la ventana de recuperación tras la
        # suspensión por billing, el scale-from-zero devolvía 429 ("no available
        # instance") aunque el contenedor arrancaba sano. Se mitigó temporalmente
        # con minScale=1. Verificado el mismo día que el cold-start se recuperó
        # (log "Starting new instance. Reason: AUTOSCALING" + HTTP 200) → vuelto
        # a 0. Si reaparece el 429 tras un corte de billing, subir a 1 y esperar.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: clicks-sa@clicks-and-go.iam.gserviceaccount.com
      # El orquestador corre tareas pesadas — 1 request a la vez por instancia es suficiente
      containerConcurrency: 1
      # Las misiones de scraping pueden tardar hasta 5 minutos
      timeoutSeconds: 300
      containers:
      - image: us-central1-docker.pkg.dev/clicks-and-go/clicks-and-go/python:latest
        ports:
        - name: http1
          containerPort: 5001
        resources:
          limits:
            cpu: "2"
            memory: 1Gi
        env:
        # 💰 Loop interno apagado en Cloud Run — Cloud Scheduler dispara /trigger/news.
        - name: NEWS_LOOP_ENABLED
          value: "false"
        - name: GCP_PROJECT_ID
          value: clicks-and-go
        - name: GCP_LOCATION
          value: us-central1
        # 💰 Tope diario de llamadas a IA de pago; al superarlo cae a Antigravity (costo cero)
        - name: AI_DAILY_LIMIT
          value: "500"
        # La service account del contenedor autentica Vertex AI automáticamente
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: ""
        - name: RAILS_API_URL
          value: https://clicks-rails-798903122073.us-central1.run.app/api/v1/notebooks
        - name: RUST_API_URL
          value: https://clicks-rust-798903122073.us-central1.run.app/api/v1/score/batch
        - name: RUST_BENCHMARK_URL
          value: https://clicks-rust-798903122073.us-central1.run.app/api/v1/benchmarks/run
        # 📧 PriceAlertAgent: link de "ver producto" dentro del email de alerta.
        # Debe ser la URL que realmente sirve el sitio (misma base que AUTH_URL
        # en cloudrun-web.yaml), o el usuario recibe un link que no abre.
        - name: PUBLIC_WEB_URL
          value: https://clicks-and-go.com
        - name: AUTH_FROM_EMAIL
          value: noreply@clicks-and-go.com
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: MONGODB_URI
              key: latest
        # 🛡️ Llama a GET /api/v1/price_alerts/pending y POST /mark_notified en Rails
        # (mismo secreto compartido que usa Web — ver INTERNAL_API_KEY en cloudrun-rails.yaml).
        - name: INTERNAL_API_KEY
          valueFrom:
            secretKeyRef:
              name: INTERNAL_API_KEY
              key: latest
        # Sin esta key, PriceAlertAgent detecta alertas alcanzadas pero no envía
        # el email (las deja pendientes) — ver Python/src/agents/price_alert_agent.py.
        # ⏸️ Descomentar cuando exista la cuenta Resend + el secreto en Secret Manager
        # (si se referencia un secreto inexistente, Cloud Run rechaza el deploy).
        # - name: AUTH_RESEND_KEY
        #   valueFrom:
        #     secretKeyRef:
        #       name: AUTH_RESEND_KEY
        #       key: latest
        livenessProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 3
