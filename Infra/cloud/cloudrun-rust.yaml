# =========================================================
# CLOUD RUN - Rust Engine (El Motor Matematico)
# Deploy: gcloud run services replace Infra/cloud/cloudrun-rust.yaml --region us-central1
# =========================================================
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: clicks-rust
  labels:
    app: clicks-and-go
    tier: math-engine
  annotations:
    # Público a nivel red, pero protegido: los backends deben endurecerse con
    # IAM (roles/run.invoker) antes del lanzamiento real. Pre-lanzamiento: abierto.
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        # Rust arranca en <100ms — escala a 0 sin cold-start perceptible
        # 💰 minScale=0 — escala a cero (1ª visita paga ~1-4s de cold-start).
        # Historia: el 2026-07-17, durante la ventana de recuperación tras la
        # suspensión por billing, el scale-from-zero devolvía 429 ("no available
        # instance") aunque el contenedor arrancaba sano. Se mitigó temporalmente
        # con minScale=1. Verificado el mismo día que el cold-start se recuperó
        # (log "Starting new instance. Reason: AUTOSCALING" + HTTP 200) → vuelto
        # a 0. Si reaparece el 429 tras un corte de billing, subir a 1 y esperar.
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "10"
        # 💰 CPU facturada solo durante requests.
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: clicks-sa@clicks-and-go.iam.gserviceaccount.com
      # Axum es async y ultra-eficiente — aguanta 100 requests concurrentes por instancia
      containerConcurrency: 100
      timeoutSeconds: 10
      containers:
      - image: us-central1-docker.pkg.dev/clicks-and-go/clicks-and-go/rust:latest
        ports:
        - name: http1
          containerPort: 8080
        resources:
          # Rust usa CPU sin OOM — 2 cores para Rayon parallelism
          limits:
            cpu: "2"
            memory: 256Mi
        env:
        - name: RUST_LOG
          value: info
        - name: BENCHMARK_CPU_URL
          value: "https://www.cpubenchmark.net/laptop.html"
        - name: BENCHMARK_GPU_URL
          value: "https://www.videocardbenchmark.net/laptop_video_card_list.html"
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: MONGODB_URI
              key: latest
        startupProbe:
          httpGet:
            path: /health
          initialDelaySeconds: 5
          periodSeconds: 3
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /health
          periodSeconds: 15
          failureThreshold: 3
