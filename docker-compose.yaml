# =========================================================
# 🛡️ CLICKS & GO - COMPOSE BASE (PERFIL CLOUD por defecto)
# Las bases de datos viven en Google Cloud SQL y MongoDB Atlas (.env).
# Para desarrollo local con contenedores de DB:
#   docker compose -f docker-compose.yaml -f docker-compose.local.yml up
# =========================================================
networks:
  clicksandgo_net:
    driver: bridge

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  # =========================================================
  # 💎 MICROSERVICIOS PRINCIPALES (Capa Interna Oculta)
  # =========================================================
  rails_backend:
    build: ./Rails
    container_name: clicks_rails
    restart: unless-stopped
    env_file: .env
    environment:
      - RAILS_ENV=production
      # 🗄️ Cloud SQL (Google) vía DATABASE_URL del .env
      - DATABASE_URL=${DATABASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE:-llave_maestra_temporal_para_docker_1234567890}
      - PORT=3000
    networks:
      - clicksandgo_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/up" ]
      interval: 15s
      timeout: 5s
      retries: 3

  python_ai:
    build: ./Python
    container_name: clicks_python
    restart: unless-stopped
    env_file: .env
    environment:
      - RAILS_API_URL=http://rails_backend:3000
      - RUST_API_URL=http://rust_engine:8080/api/v1/score/batch
      - RUST_BENCHMARK_URL=http://rust_engine:8080/api/v1/benchmarks/run
      # 🍃 MongoDB Atlas (.env) — unificamos el nombre interno MONGO_URI
      - MONGO_URI=${MONGODB_URI}
      - MONGODB_URI=${MONGODB_URI}
      # 🛰️ Vertex AI: el JSON del service account se monta dentro del contenedor
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-vertex.json
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
      - GCP_LOCATION=${GCP_LOCATION:-us-central1}
      # 🔷 Gemini API por API key (AI Studio) — inteligencia real sin billing GCP
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - PORT=5001
    volumes:
      - ./gcp-vertex.json:/app/gcp-vertex.json:ro
    networks:
      - clicksandgo_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      rails_backend:
        condition: service_healthy
      rust_engine:
        condition: service_started
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5001/health" ]
      interval: 30s
      timeout: 5s
      retries: 3

  rust_engine:
    build: ./Rust
    container_name: clicks_rust
    restart: unless-stopped
    env_file: .env
    environment:
      - RUST_LOG=info
      - MONGO_URI=${MONGODB_URI}
      - PORT=8080
    networks:
      - clicksandgo_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  # =========================================================
  # 🌐 FACHADA PERIMETRAL (La única cara hacia Internet)
  # =========================================================
  web_frontend:
    build: ./Web
    container_name: clicks_nextjs
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - RAILS_API_URL=http://rails_backend:3000
      - PORT=3000
    ports:
      - "80:3000" # 🚀 ÚNICO PUERTO EXPUESTO AL MUNDO EXTERIOR
    networks:
      - clicksandgo_net
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 1G
    depends_on:
      rails_backend:
        condition: service_healthy
